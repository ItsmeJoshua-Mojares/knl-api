; config/supervisor.conf
; ─────────────────────────────────────────────────────────────
; CONCEPT: Why Supervisor for queue workers?
;
; php artisan queue:work runs ONE queue worker process. The
; problem: if that process crashes (out of memory, unhandled
; exception, server restart), your emails and notifications
; stop being sent silently — no alert, just a growing backlog.
;
; Supervisor is a process control system for Linux. It:
;   1. Starts your queue workers automatically on server boot
;   2. Restarts them instantly if they crash
;   3. Lets you run MULTIPLE workers in parallel (numprocs=3
;      means 3 workers processing the queue simultaneously)
;   4. Logs output so you can diagnose failures
;
; INSTALLATION (Ubuntu):
;   sudo apt install supervisor
;   sudo cp config/supervisor.conf /etc/supervisor/conf.d/knl-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start knl-worker:*
;
; VERIFY IT'S RUNNING:
;   sudo supervisorctl status
;   # Should show: knl-worker:knl-worker_00   RUNNING
;                  knl-worker:knl-worker_01   RUNNING
;                  knl-worker:knl-worker_02   RUNNING
;
; CHECKING LOGS:
;   tail -f /var/log/supervisor/knl-worker.log
; ─────────────────────────────────────────────────────────────

[program:knl-worker]
; The command Supervisor runs to start each worker process.
; --queue=default processes the default queue.
; --sleep=3 means idle workers check for new jobs every 3 seconds.
; --tries=3 retries failed jobs up to 3 times before marking them failed.
; --max-time=3600 restarts the worker after 1 hour to prevent memory leaks.
command=/usr/bin/php /var/www/knl-api/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600

; Number of parallel worker processes.
; 3 workers can process 3 jobs simultaneously (e.g. 3 order emails at once).
; Increase this if you see email delays during peak order times.
numprocs=3

; Give each worker process a unique name (knl-worker_00, knl-worker_01, etc.)
process_name=%(program_name)s_%(process_num)02d

; Run as the web server user (not root — security best practice)
user=forge

; Automatically start workers when Supervisor starts
autostart=true

; Restart the worker if it exits for any reason (crash, OOM, etc.)
autorestart=true

; Wait up to 3600 seconds before force-killing a worker during a restart.
; This lets in-progress jobs (like sending a large batch email) finish.
stopwaitsecs=3600

; Where to write worker output for debugging
stdout_logfile=/var/log/supervisor/knl-worker.log
stderr_logfile=/var/log/supervisor/knl-worker-error.log

; Keep the last 50MB of logs, rotating to 10 backup files
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; Redirect stderr to the same log file for simplicity
redirect_stderr=false
