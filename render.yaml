services:
  - type: web
    name: knl-api
    runtime: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://knl-api.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: knl-api-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://knlatelier.com
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: knl-api-db
    plan: free
    ipAllowList: []
